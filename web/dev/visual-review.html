<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mochi visual review · offline fixture</title>
<link rel="stylesheet" href="../social.css" />
<style>
body{margin:0;background:#e7ddc7}.review-controls{box-sizing:border-box}#result{position:fixed;left:12px;bottom:8px;z-index:50;max-width:calc(100vw - 24px);background:#fff8e9ed;padding:8px;border-radius:8px;font:11px system-ui;overflow-wrap:anywhere}#world{height:calc(100vh - 64px);position:relative;overflow:hidden}
.review-controls{height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff8e9;color:#504a38;flex-wrap:wrap;font:13px system-ui}
.review-controls label{display:flex;gap:8px;align-items:center}.review-controls select{padding:6px}.review-controls span{font-size:11px}
@media(max-width:650px){.review-controls{height:104px}#world{height:calc(100vh - 104px)}}
</style>
<div class="review-controls"><strong>Visual review</strong><label>Room <select id="room"><option value="town">Town</option><option value="yard">Training Yard</option><option value="forest">Forest</option><option value="lake">Lake</option><option value="ruins">Ruins</option><option value="exchange">Trading Hall</option><option value="market">Marketplace</option></select></label><button id="remount" type="button">Remount renderer</button><span>Offline presentation only · no gameplay, rewards or network authority</span></div>
<div id="world"></div>
<p id="result" role="status" hidden></p>
<script type="module">
  import { SPAWNS, MOB_DEFINITIONS } from "../js/game/adventure.js";
  import { IsometricWorld } from "../js/isoworld/World.js";
  const result = document.querySelector("#result");
  const player = {
    userId: "bench",
    x: 550,
    y: 550,
    rotation: 0,
    avatar: {
      display_name: "Visual review avatar",
      appearance: { style: "classic" },
    },
    companion: {
      id: "bench-pet",
      x: 595,
      y: 565,
      name: "Moonfox",
      profile: { beast: { archetype: "moonfox" } },
    },
  };
  let room = "town";
  const noop = () => {};
  const scene = {
    data: new Map([["bench", player]]),
    motion: new Map(),
    petMotion: new Map(),
    emotes: new Map(),
    reactions: new Map(),
    combatEffects: [],
    ping: 0,
    movementHz: 20,
    network: {},
    audio: { volume: 0, cue: noop, setVolume: noop, setRoom: noop },
    moveTo: noop,
    snapshot: () => ({
      roomId: room,
      players: [player],
      bubbles: new Map(),
      loading: false,
    }),
    subscribe: () => noop,
  };
  const bridge = new Proxy(
    { selfId: "bench" },
    { get: (o, k) => o[k] ?? noop },
  );
  try {
    let world = new IsometricWorld(
      document.querySelector("#world"),
      bridge,
      { development: true },
      scene,
    );
    await world.init();

    const select = document.querySelector("#room");
    select.onchange = () => {
      room = select.value;
      const mobs = SPAWNS.filter(spawn => spawn.room === room).flatMap(spawn =>
        spawn.cells.map(([x,y],i) => {
          const type = spawn.mobTypes[i % spawn.mobTypes.length];
          const definition = MOB_DEFINITIONS[type];
          return {id:`review-${spawn.id}-${i}`,type,name:definition.name,level:definition.level,x,y,hp:definition.health,maxHp:definition.health};
        }));
      scene.adventure = {roomId:room,mobs};
      world.sync();
    };
    let mount = 1;
    const remount = document.querySelector("#remount");
    remount.onclick = async () => {
      remount.disabled = true;
      const previous = world;
      const shared = previous.animationAtlases.map(art => art.texture);
      previous.destroy();
      world = new IsometricWorld(document.querySelector("#world"), bridge, {development:true}, scene);
      await world.init();
      result.hidden = false;
      result.textContent = JSON.stringify({
        mount: ++mount,
        previousReleased: previous.textureOwnership.released && previous.textures.length === 0,
        sharedSheetsReused: world.animationAtlases.every((art,i) => art.texture === shared[i]),
        sharedSourcesValid: shared.every(texture => !texture.destroyed && !texture.source.destroyed),
        ownedFrames: world.textureOwnership.owned.size,
        ownedCanvasSources: world.textureOwnership.sources.size,
        hostCanvases: document.querySelectorAll("#world canvas").length,
      });
      remount.disabled = false;
    };
    addEventListener("pagehide", () => world.destroy(), {once:true});
  } catch (error) {
    result.hidden = false;
    result.textContent = error.stack;
  }
</script>
